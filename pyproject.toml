[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ogak-ussd"
version = "1.0.0"
description = "Ogak — Non-P2P Crypto-Fiat Integration USSD Platform for Nigeria"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "Ogak Team"},
]

[project.scripts]
ogak-ussd = "packages.ussd.main:start"
ogak-api = "packages.api.main:start"
ogak-ilp = "packages.ilp_connector.connector:start"
ogak-admin = "packages.admin.main:start"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-v --tb=short"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "S", "B", "A", "C4", "ICN", "PIE", "T20", "SIM"]
ignore = ["S101", "S104"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
